name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: repz_test
          MYSQL_USER: repz
          MYSQL_PASSWORD: repz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: "false"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: repz
      MYSQL_PASSWORD: repz
      MYSQL_DATABASE: repz_test
      REDIS_URL: redis://127.0.0.1:6379/0
      FIREBASE_CREDENTIALS_PATH: ./missing.json
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app --ignore-missing-imports
      - name: Pytest
        run: pytest -q
      - name: Docker build
        run: docker build -t repz-api:ci .
