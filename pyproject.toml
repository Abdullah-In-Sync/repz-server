[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repz-server"
version = "0.1.0"
description = "Repz workout logging and analytics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncmy>=0.2.9",
  "pymysql>=1.1.1",
  "cryptography>=43.0.0",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "firebase-admin>=6.6.0",
  "redis>=5.2.0",
  "apscheduler>=3.10.4",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "pillow>=11.0.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "sentry-sdk[fastapi]>=2.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "factory-boy>=3.3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
